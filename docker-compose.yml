services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coldreach
      POSTGRES_PASSWORD: coldreach_dev_password
      POSTGRES_DB: coldreach
    ports:
      - "5432:5432"
    volumes:
      - coldreach_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldreach -d coldreach"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - coldreach_redis:/data
volumes:
  coldreach_pg:
  coldreach_redis:
